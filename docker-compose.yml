version: '3.8'

services:
  # 1. Redis 서비스 정의
  redis:
    image: redis:7-alpine  # 경량화된 최신 Redis 이미지를 사용합니다.
    container_name: waf_redis
    command: redis-server --save 60 1 --loglevel warning # 60초마다 1개 이상의 키가 변경되면 디스크에 저장(영속성)
    volumes:
      - ./redis-data:/data # Redis 데이터를 호스트 PC의 ./redis-data 폴더에 저장하여 컨테이너가 삭제되어도 데이터가 보존되게 합니다.
    ports:
      - "6379:6379" # 로컬 PC에서 Redis에 직접 접속하여 디버깅할 수 있도록 포트를 개방합니다.

  # 2. Responder 서비스 정의
  responder:
    build: ./responder  # ./responder 폴더의 Dockerfile을 사용하여 이미지를 빌드합니다.
    container_name: waf_responder
    ports:
      - "8000:8000" # FastAPI 애플리케이션에 접속할 수 있도록 8000번 포트를 개방합니다.
    environment:
      # 이 부분이 핵심입니다. 애플리케이션이 접속해야 할 Redis 호스트를 알려줍니다.
      # 'redis'는 위에 정의한 Redis 서비스의 이름입니다.
      - REDIS_HOST=redis
    depends_on:
      - redis # responder를 실행하기 전에 redis 서비스를 먼저 실행시킵니다.
