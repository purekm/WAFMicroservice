apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detection
  template:
    metadata:
      labels:
        app: detection
    spec:
      containers:
      - name: detection
        image: waf-detection:latest # <-- 중요: 실제 이미지 경로로 변경하세요
        ports:
        - containerPort: 5000
        env:
        - name: RESPONDER_URL
          value: "http://responder:8000/block"
---
apiVersion: v1
kind: Service
metadata:
  name: detection
spec:
  selector:
    app: detection
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
